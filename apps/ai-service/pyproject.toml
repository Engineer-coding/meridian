[project]
name = "meridian-ai"
version = "0.4.0"
description = "Meridian AI servisi: indeksleme ve retrieval"
readme = "README.md"
authors = [
    { name = "Latif Şimşek", email = "simseklatif5496@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aio-pika>=10.2.2",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "mcp>=1.20",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "sqlglot>=27",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "testcontainers[postgres,rabbitmq]>=4.15.0",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert, sabit test parolaları, tohumlu rastgelelik, süre parametreli bekleme yardımcıları
# ve test verisinden kurulan SQL olağandır.
"tests/**" = ["S101", "S105", "S106", "S311", "S608", "ASYNC109"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
