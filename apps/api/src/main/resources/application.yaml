spring:
  application:
    name: meridian-api
  threads:
    virtual:
      enabled: true
  
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/meridian
    username: meridian_app
    password: ${DB_APP_PASSWORD}
  flyway:
    user: meridian_owner
    password: ${DB_OWNER_PASSWORD}
    default-schema: core
    schemas: core
    create-schemas: false
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/meridian
          audiences: meridian-api
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # Aktarıcı her partiden sonra broker'ın diske yazdığını bekler (ADR-0004).
    publisher-confirm-type: simple
  data:
    redis:
      host: localhost
      port: 6379
      # Oran sınırı Redis kapalıyken isteği bekletmemeli (kapalıysa sınırsız geçer).
      timeout: 500ms
      connect-timeout: 500ms
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis yalnızca oran sınırı içindir; kapalı olması API'yi hazır-değil yapmaz.
    redis:
      enabled: false

meridian:
  ai:
    url: http://127.0.0.1:8090
    internal-token: ${AI_INTERNAL_TOKEN}
    # CPU'daki yerel modelle bir cevap dakikalar sürebilir (ADR-0008).
    answer-deadline: 5m
  chat:
    rate:
      capacity: 10
      refill-per-minute: 10
  outbox:
    relay:
      url: ${spring.datasource.url}
      username: meridian_relay
      password: ${DB_RELAY_PASSWORD}
      poll-interval: 500ms
