spring:
  application:
    name: meridian-api
  threads:
    virtual:
      enabled: true
  
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/meridian
    username: meridian_app
    password: ${DB_APP_PASSWORD}
  flyway:
    user: meridian_owner
    password: ${DB_OWNER_PASSWORD}
    default-schema: core
    schemas: core
    create-schemas: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true