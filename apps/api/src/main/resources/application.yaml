spring:
  application:
    name: meridian-api
  threads:
    virtual:
      enabled: true
  
  config:
    import: optional:file:../../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/meridian
    username: meridian_app
    password: ${DB_APP_PASSWORD}
    # Yük testinde (ADR-0019) 10 bağlantı 500 eşzamanlı sohbette kuyruk oluşturdu; 20 ile p95 hedefi tuttu.
    hikari:
      maximum-pool-size: ${API_DB_POOL_SIZE:20}
  flyway:
    user: meridian_owner
    password: ${DB_OWNER_PASSWORD}
    default-schema: core
    schemas: core
    create-schemas: false
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/meridian
          audiences: meridian-api
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    # Aktarıcı her partiden sonra broker'ın diske yazdığını bekler (ADR-0004).
    publisher-confirm-type: simple
  data:
    redis:
      host: localhost
      port: 6379
      # Oran sınırı Redis kapalıyken isteği bekletmemeli (kapalıysa sınırsız geçer).
      timeout: 500ms
      connect-timeout: 500ms
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

logging:
  # Yapılandırılmış JSON (ECS): her satırda traceId, spanId ve kiracı; kişisel veri yok.
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
    ecs:
      service:
        name: meridian-api

server:
  port: 8080
  shutdown: graceful

management:
  # İzleme (ADR-0017): izler, metrikler ve loglar OTLP ile toplayıcıya gider. Gönderim varsayılan kapalıdır;
  # toplayıcı yokken her dakika bağlantı hatası yazılmasın. Span, iz kimliği ve taşınması her durumda çalışır.
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING:1.0}
    # Genel dışa aktarım açık kalmalı: bu sürümde iz bağlamının servisler arası taşınması da ona bağlı.
    # Toplayıcıya gönderim aşağıdaki OTLP anahtarıyla açılır.
    export:
      otlp:
        enabled: ${OTEL_EXPORT:false}
    propagation:
      type: W3C
  opentelemetry:
    resource-attributes:
      service.namespace: meridian
      deployment.environment: ${DEPLOYMENT_ENVIRONMENT:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://127.0.0.1:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${OTEL_ENDPOINT:http://127.0.0.1:4318}/v1/logs
  logging:
    export:
      otlp:
        enabled: ${OTEL_EXPORT:false}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_EXPORT:false}
        url: ${OTEL_ENDPOINT:http://127.0.0.1:4318}/v1/metrics
        step: 15s
        # Prometheus adları saniyeyle biter (http_server_requests_seconds); diğer servislerle aynı birim.
        base-time-unit: seconds
  metrics:
    distribution:
      # SLO'lar yüzdelik ister (ADR-0017): HTTP süreleri histogram olarak gider.
      percentiles-histogram:
        http.server.requests: true
        meridian.ai.request: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis yalnızca oran sınırı içindir; kapalı olması API'yi hazır-değil yapmaz.
    redis:
      enabled: false

meridian:
  ai:
    url: http://127.0.0.1:8090
    internal-token: ${AI_INTERNAL_TOKEN}
    # CPU'daki yerel modelle bir cevap dakikalar sürebilir (ADR-0008).
    answer-deadline: 5m
  chat:
    rate:
      capacity: 10
      refill-per-minute: 10
  search:
    # Embedding CPU harcar; MCP ve API anahtarları bu sınırla modeli meşgul edemez.
    rate:
      capacity: 60
      refill-per-minute: 60
  usage:
    # Plan başına günlük token (ADR-0014). Yerel modelde bir cevap ~2-8 bin token.
    daily-tokens:
      free: 200000
      team: 2000000
      enterprise: 20000000
    # Yerel model ücretsiz; ücretli sağlayıcı eklenince buradan fiyatlanır.
    prompt-usd-per-million: 0
    completion-usd-per-million: 0
  outbox:
    relay:
      url: ${spring.datasource.url}
      username: meridian_relay
      password: ${DB_RELAY_PASSWORD}
      poll-interval: 500ms
