name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Elle: gh workflow run ci.yml --ref <dal> (PR açmadan bir dalı sınamak için).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --redact --no-banner -v

  infra-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: make up
      - run: make smoke
      - run: make obs-check
      - if: failure()
        run: make ps && docker compose -f infra/compose/compose.yaml --env-file .env logs --tail=50
      - if: always()
        run: make down
  
  contract-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make contract-lint

  eval-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make eval-validate PYTHON=python3
  
  api-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: make api-test
  ai-service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - run: make ai-test

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run check:eval
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  full-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: make e2e-full

  eval-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.4'
          enable-cache: true
          cache-dependency-glob: apps/ai-service/uv.lock
      - run: make eval-smoke
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Helm chart (ADR-0009): lint, birim testleri ve şema doğrulaması.
  helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: araçlar (infra/versions.env)
        run: |
          set -a; . infra/versions.env; set +a
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          helm plugin install https://github.com/helm-unittest/helm-unittest --version "${HELM_UNITTEST_VERSION}" --verify=false
      - run: make helm-test

  # Yerel kümenin aynısı: kind + Argo CD; chart bu commit'ten senkronlanır, model ve GitHub sahte (values-ci.yaml).
  k8s:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: araç sürümleri
        run: grep -E '^(KIND_VERSION|HELM_VERSION)=' infra/versions.env >> "$GITHUB_ENV"
      - uses: helm/kind-action@v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          install_only: true
      - name: helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
      - run: make images
      - run: bash infra/k8s/up.sh ci argo ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash infra/k8s/smoke.sh http://meridian.localtest.me alice alice
      - if: failure()
        run: |
          kubectl get pods -A
          kubectl -n argocd get applications -o wide
          kubectl -n meridian get events --sort-by=.lastTimestamp | tail -40
          for d in meridian-api meridian-ai meridian-web keycloak; do kubectl -n meridian logs deploy/$d --tail=40 || true; done
          kubectl -n meridian logs job/meridian-seed --tail=40 || true
