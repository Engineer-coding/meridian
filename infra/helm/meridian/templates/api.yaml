{{- $c := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meridian-api
  labels: {{- include "meridian.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "meridian.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "meridian.labels" $c | nindent 8 }}
    spec:
      {{- include "meridian.podSecurity" (dict "uid" 10001) | nindent 6 }}
      containers:
        - name: api
          image: {{ include "meridian.image" (dict "root" . "repository" .Values.api.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "meridian.containerSecurity" . | nindent 10 }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/meridian
            - name: API_DB_POOL_SIZE
              value: {{ .Values.api.dbPoolSize | quote }}
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: {{ include "meridian.issuer" . }}
            - name: MERIDIAN_AI_URL
              value: "http://meridian-ai:8090"
            {{- range list "DB_APP_PASSWORD" "DB_OWNER_PASSWORD" "DB_RELAY_PASSWORD" "RABBITMQ_USER" "RABBITMQ_PASSWORD" "AI_INTERNAL_TOKEN" }}
            {{- include "meridian.secretEnv" (dict "root" $ "name" .) | nindent 12 }}
            {{- end }}
            {{- include "meridian.otelEnv" . | nindent 12 }}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: meridian-api
  labels: {{- include "meridian.labels" $c | nindent 4 }}
spec:
  selector: {{- include "meridian.selector" $c | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
