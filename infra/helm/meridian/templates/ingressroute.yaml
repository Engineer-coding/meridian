{{- $host := include "meridian.host" . -}}
# Tek adres (ADR-0009): /auth → Keycloak, /mcp → AI servisi, geri kalanı web. API ve /internal dışarıya açık değil.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: meridian
  labels: {{- include "meridian.labels" (dict "root" . "component" "ingress") | nindent 4 }}
spec:
  entryPoints: {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    - match: Host(`{{ $host }}`) && PathPrefix(`/auth`)
      kind: Rule
      services:
        - {name: keycloak, port: 8080}
    - match: Host(`{{ $host }}`) && PathPrefix(`/mcp`)
      kind: Rule
      services:
        - {name: meridian-ai, port: 8090}
    - match: Host(`{{ $host }}`)
      kind: Rule
      services:
        - {name: meridian-web, port: 3000}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
