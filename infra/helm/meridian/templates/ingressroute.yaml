{{- $host := include "meridian.host" . -}}
{{- $labels := include "meridian.labels" (dict "root" . "component" "ingress") -}}
# Tek adres (ADR-0009): /auth → Keycloak, /mcp → AI servisi, geri kalanı web. API ve /internal dışarıya açık değil.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: meridian
  labels: {{- $labels | nindent 4 }}
spec:
  entryPoints: {{- toYaml .Values.ingress.entryPoints | nindent 4 }}
  routes:
    {{- if .Values.ingress.blockKeycloakAdmin }}
    # Yönetim konsolu ve master realm dışarıya kapalı (403); yönetim için: kubectl port-forward svc/keycloak.
    - match: Host(`{{ $host }}`) && (PathPrefix(`/auth/admin`) || PathPrefix(`/auth/realms/master`))
      kind: Rule
      middlewares:
        - {name: meridian-block}
      services:
        - {name: keycloak, port: 8080}
    {{- end }}
    - match: Host(`{{ $host }}`) && PathPrefix(`/auth`)
      kind: Rule
      services:
        - {name: keycloak, port: 8080}
    - match: Host(`{{ $host }}`) && PathPrefix(`/mcp`)
      kind: Rule
      services:
        - {name: meridian-ai, port: 8090}
    - match: Host(`{{ $host }}`)
      kind: Rule
      services:
        - {name: meridian-web, port: 3000}
  {{- with .Values.ingress.tls }}
  {{- if .secretName }}
  tls:
    secretName: {{ .secretName }}
  {{- end }}
  {{- end }}
{{- if .Values.ingress.blockKeycloakAdmin }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: meridian-block
  labels: {{- $labels | nindent 4 }}
spec:
  ipAllowList:
    sourceRange: [127.0.0.1/32]
{{- end }}
{{- if and .Values.ingress.tls .Values.ingress.tls.secretName }}
---
# HTTP → HTTPS. cert-manager'ın HTTP-01 doğrulaması kendi, daha uzun kuralıyla bundan önce eşleşir.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: meridian-http
  labels: {{- $labels | nindent 4 }}
spec:
  entryPoints: [web]
  routes:
    - match: Host(`{{ $host }}`)
      kind: Rule
      middlewares:
        - {name: meridian-https}
      services:
        - {name: meridian-web, port: 3000}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: meridian-https
  labels: {{- $labels | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
