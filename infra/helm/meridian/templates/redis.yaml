{{- $c := dict "root" . "component" "redis" -}}
# Redis yalnızca oran sınırı için (ADR-0014): kalıcı disk yok, kapanırsa istekler sınırsız geçer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "meridian.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "meridian.selector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "meridian.labels" $c | nindent 8 }}
    spec:
      {{- include "meridian.podSecurity" (dict "uid" 999) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--save", "", "--appendonly", "no"]
          {{- include "meridian.containerSecurity" . | nindent 10 }}
          ports:
            - {name: redis, containerPort: 6379}
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 5
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "meridian.labels" $c | nindent 4 }}
spec:
  selector: {{- include "meridian.selector" $c | nindent 4 }}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
