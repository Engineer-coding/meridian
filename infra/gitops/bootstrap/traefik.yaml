# Traefik ingress denetleyicisi: dış chart, değerler repodan (traefik-values.yaml).
# REVISION ve TRAEFIK_CHART_VERSION, infra/k8s/up.sh tarafından doldurulur.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: TRAEFIK_CHART_VERSION
      helm:
        valueFiles: [$values/infra/gitops/bootstrap/traefik-values.yaml]
    - repoURL: https://github.com/Engineer-coding/meridian.git
      targetRevision: REVISION
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
