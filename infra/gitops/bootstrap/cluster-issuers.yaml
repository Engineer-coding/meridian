# Let's Encrypt (HTTP-01, Traefik). staging: prova kurulumları için; aynı ad için haftalık 5 sertifika sınırı yok.
# ACME_EMAIL infra/k8s/up.sh tarafından doldurulur (boş olabilir: süre dolumu e-postası gelmez).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "ACME_EMAIL"
    privateKeySecretRef: {name: letsencrypt-account}
    solvers:
      - http01:
          ingress: {ingressClassName: traefik}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: "ACME_EMAIL"
    privateKeySecretRef: {name: letsencrypt-staging-account}
    solvers:
      - http01:
          ingress: {ingressClassName: traefik}
