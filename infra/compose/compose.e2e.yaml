# Tam sistem testi için atılabilir altyapı (make e2e-full). Geliştirme ortamıyla aynı imajlar ve başlangıç
# scriptleri; ayrı proje adı, ayrı portlar ve kalıcı olmayan disk: geliştirme verisine dokunmaz.
name: meridian-e2e

services:
  postgres:
    extends:
      file: compose.yaml
      service: postgres
    ports: !override
      - "127.0.0.1:15432:5432"
    volumes: !override
      - ../helm/meridian/files/postgres/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    extends:
      file: compose.yaml
      service: redis
    ports: !override
      - "127.0.0.1:16379:6379"

  rabbitmq:
    extends:
      file: compose.yaml
      service: rabbitmq
    ports: !override
      - "127.0.0.1:15673:5672"
    volumes: !override []

  keycloak:
    extends:
      file: compose.yaml
      service: keycloak
    environment:
      KC_HOSTNAME: http://localhost:18180
    ports: !override
      - "127.0.0.1:18180:8080"

  otel-collector:
    extends:
      file: compose.yaml
      service: otel-collector
    ports: !override
      - "127.0.0.1:14318:4318"

  tempo:
    extends:
      file: compose.yaml
      service: tempo
    ports: !override
      - "127.0.0.1:13201:3200"
    volumes: !override
      - ../helm/meridian/files/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    tmpfs:
      - /var/tempo:uid=10001,gid=10001

  prometheus:
    extends:
      file: compose.yaml
      service: prometheus
    ports: !override
      - "127.0.0.1:19090:9090"
    volumes: !override
      - ../helm/meridian/files/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../helm/meridian/files/prometheus/rules:/etc/prometheus/rules:ro

  loki:
    extends:
      file: compose.yaml
      service: loki
    ports: !override
      - "127.0.0.1:13100:3100"
    volumes: !override
      - ../helm/meridian/files/loki/loki.yaml:/etc/loki/loki.yaml:ro
    tmpfs:
      - /loki:uid=10001,gid=10001

  grafana:
    extends:
      file: compose.yaml
      service: grafana
    ports: !override
      - "127.0.0.1:13001:3000"
