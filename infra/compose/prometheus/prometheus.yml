# Prometheus (ADR-0018): servis metrikleri toplayıcıdan, kuyruk derinliği RabbitMQ'dan kazınır.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Kuyruk başına mesaj sayısı (DLQ derinliği alarmı, ADR-0011).
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
